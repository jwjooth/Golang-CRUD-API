tone_instructions: |
  Keep reviews concise and direct. Focus on actionable issues in logic,
  security, performance, and error handling. Skip routine style feedback
  covered by linters. Suggest a concrete fix when possible.

reviews:
  profile: chill
  # 1. Izinkan bot menyetujui otomatis jika tidak ada bug kritis
  auto_approve_if_clean: true
  
  # 2. AKTIFKAN INI agar perintah @coderabbitai approve/resolve berfungsi
  request_changes_workflow: true