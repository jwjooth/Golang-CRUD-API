basePath: /api/v1
definitions:
  helper.ErrorEnvelope:
    properties:
      error:
        type: string
    type: object
  payload.BookRequest:
    properties:
      author:
        type: string
      category_id:
        type: integer
      stock:
        type: integer
      title:
        type: string
    required:
    - author
    - category_id
    - stock
    - title
    type: object
  payload.BookResponse:
    properties:
      author:
        type: string
      category_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      stock:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  payload.CategoryRequest:
    properties:
      name:
        type: string
    type: object
  payload.CategoryResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  payload.CreateProductRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        type: number
      stock:
        minimum: 0
        type: integer
    required:
    - name
    - price
    type: object
  payload.ListBookMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_page:
        type: integer
    type: object
  payload.ListBookResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/payload.BookResponse'
        type: array
      meta:
        $ref: '#/definitions/payload.ListBookMeta'
    type: object
  payload.ListProductsMeta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  payload.ListProductsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/payload.ProductResponse'
        type: array
      meta:
        $ref: '#/definitions/payload.ListProductsMeta'
    type: object
  payload.ProductResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: number
      stock:
        type: integer
      updated_at:
        type: string
    type: object
  payload.UpdateProductRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      price:
        type: number
      stock:
        minimum: 0
        type: integer
    required:
    - name
    - price
    type: object
