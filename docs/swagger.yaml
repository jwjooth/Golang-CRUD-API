paths:
  /books:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of all books
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/payload.ListBookResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
      tags:
      - book
    post:
      consumes:
      - application/json
      description: Create a new book with the provided details
      parameters:
      - description: Book request payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/payload.BookRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/payload.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helper.ErrorEnvelope'
      tags:
      - book
