name: Upload Go test results

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Install dependencies
        run: go mod download
      - name: Test with Go
        run: go test ./...
      - name: Double check code
        run: go vet ./...
      - name: Build the apps
        run: go build ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (echo "Run 'gofmt -w .' to fix" && exit 1)
      - name: Comment on PR if test failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const message = `⚠️ **CI Check Failed!**\n\nTerdapat kesalahan dalam pipeline:\n- Pastikan semua unit test lolos.\n- Jalankan 'go test ./...' secara lokal untuk melihat detail error.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const hasComment = comments.some(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('CI Check Failed')
            );
            
            if (!hasComment) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: message
              });
            }
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: perpetual-patience
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: golangci/golangci-lint-action@v6